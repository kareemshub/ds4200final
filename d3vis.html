<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Foreign Aid - MENA and Sub-Saharan Africa</title>
    <script src="https://d3js.org/d3.v6.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .chart {
            margin: 50px auto;
            width: 80%;
            height: 600px;
        }
        .axis-label {
            font-size: 12px;
            font-weight: bold;
        }
        .tooltip {
            position: absolute;
            text-align: center;
            padding: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 3px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">US Foreign Aid Over Time - MENA and Sub-Saharan Africa</h2>
    <h3 style="text-align: center; font-weight: normal; color: #555;">
        Interactive Visualization with Region and Year Filtering
    </h3>

    <!-- Dropdown for Region Selection -->
    <div style="text-align:center; margin-bottom: 20px;">
        <label for="regionSelect">Select Region: </label>
        <select id="regionSelect">
            <option value="MENA">Middle East and North Africa</option>
            <option value="SubSaharan">Sub-Saharan Africa</option>
        </select>

        &nbsp;&nbsp;&nbsp;

        <label for="timeFrame">Select Time Frame: </label>
        <select id="timeFrame">
            <option value="all">All Time</option>
            <option value="2000-2010">2000-2010</option>
            <option value="2010-2020">2010-2020</option>
        </select>
    </div>

    <!-- Chart Container -->
    <div class="chart" id="chart"></div>
    <div class="tooltip" id="tooltip"></div>

    <!-- Other Group Explanation -->
    <div style="text-align:center; font-size: 0.9em; color: gray; margin-top: 10px;">
        <em>Note: “Other” includes countries such as Cambodia, Laos, and Fiji.</em>
    </div>

    <script src="d3_visualization (1).js"></script>

</body>
</html>
